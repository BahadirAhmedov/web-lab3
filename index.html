<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="score">
        <span class="score__label">Счёт</span>
        <span class="score__value" id="score">0</span>
      </div>
    </header>

    <div class="toolbar">
      <button class="btn" id="undo-btn" type="button">Отменить ход</button>
      <button class="btn" id="restart-btn" type="button">Начать заново</button>
      <button class="btn" id="leaders-btn" type="button">Лидеры</button>
    </div>

    <div class="board" id="board">
      <div class="board__grid" id="board-grid"></div>
      <div class="board__tiles" id="board-tiles"></div>
    </div>

    <div class="controls" id="controls">
      <button class="controls__btn controls__btn--up" data-direction="up" type="button" aria-label="Вверх">&#9650;</button>
      <button class="controls__btn controls__btn--left" data-direction="left" type="button" aria-label="Влево">&#9664;</button>
      <button class="controls__btn controls__btn--down" data-direction="down" type="button" aria-label="Вниз">&#9660;</button>
      <button class="controls__btn controls__btn--right" data-direction="right" type="button" aria-label="Вправо">&#9654;</button>
    </div>
  </main>

  <div class="modal" id="game-over-modal" hidden>
    <div class="modal__content">
      <h2 class="modal__title">Игра окончена</h2>
      <p class="modal__message" id="game-over-message"></p>
      <form class="save-form" id="save-form">
        <input class="save-form__input" id="player-name" type="text" placeholder="Ваше имя" maxlength="20" required>
        <button class="btn" type="submit">Сохранить результат</button>
      </form>
      <button class="btn" id="modal-restart-btn" type="button" title="Начать заново">&#8635; Начать заново</button>
    </div>
  </div>

  <div class="modal" id="leaders-modal" hidden>
    <div class="modal__content">
      <h2 class="modal__title">Таблица лидеров</h2>
      <table class="leaders">
        <thead>
          <tr>
            <th>Имя</th>
            <th>Очки</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody id="leaders-body"></tbody>
      </table>
      <p class="leaders__empty" id="leaders-empty" hidden>Рекордов пока нет</p>
      <button class="btn" id="leaders-close-btn" type="button">Закрыть</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/view.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
